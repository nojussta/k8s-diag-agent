# Local experiment cluster (1 control-plane + 2 worker nodes).
# Two worker nodes leave room for later node-level fault scenarios
# (e.g. stopping a node with `docker stop`), which are possible extensions.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kursinis
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      lab/role: apps
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    labels:
      lab/role: observability
