# Lab alert rules. The first three mirror the kube-prometheus-stack defaults
# (KubePodCrashLooping, KubePodNotReady, KubeDeploymentReplicasMismatch); the
# last two are service-level RED alerts (latency and request rate of the demo
# services, from the podinfo metrics), as an SRE team would define them. All:
#   - they are limited to the "demo" namespace;
#   - they have a short "for" duration (the default 15 min is too long for an experiment);
#   - they carry the label lab="kursinis", which Alertmanager uses to route them to the agent.
# The annotations deliberately do not reveal the cause of the fault; the agent has to find it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-kursinis
  namespace: monitoring
  labels:
    lab: kursinis
spec:
  groups:
    - name: lab.kursinis.workloads
      rules:
        - alert: LabPodCrashLooping
          expr: |
            max_over_time(kube_pod_container_status_waiting_reason{namespace="demo", reason="CrashLoopBackOff"}[2m]) >= 1
          for: 1m
          labels:
            severity: warning
            lab: kursinis
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash looping"
            description: "Container {{ $labels.container }} of pod {{ $labels.namespace }}/{{ $labels.pod }} is in waiting state (reason: CrashLoopBackOff) for at least 1 minute."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodcrashlooping

        - alert: LabPodNotReady
          expr: |
            sum by (namespace, pod) (kube_pod_status_phase{namespace="demo", phase=~"Pending|Unknown|Failed"}) > 0
          for: 2m
          labels:
            severity: warning
            lab: kursinis
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"
            description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready phase for longer than 2 minutes."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodnotready

        - alert: LabDeploymentReplicasMismatch
          expr: |
            kube_deployment_spec_replicas{namespace="demo"} > kube_deployment_status_replicas_available{namespace="demo"}
          for: 3m
          labels:
            severity: warning
            lab: kursinis
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas"
            description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the expected number of available replicas for 3 minutes."
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubedeploymentreplicasmismatch

        - alert: LabHighLatency
          expr: |
            histogram_quantile(0.95, sum by (namespace, service, le) (
              rate(http_request_duration_seconds_bucket{namespace="demo", path!~"healthz|readyz"}[2m])
            )) > 0.5
          for: 1m
          labels:
            severity: warning
            lab: kursinis
          annotations:
            summary: "Service {{ $labels.namespace }}/{{ $labels.service }} is slow"
            description: "The 95th percentile latency of service {{ $labels.namespace }}/{{ $labels.service }} has been above 500 ms for 1 minute."

        - alert: LabTrafficDrop
          expr: |
            sum by (namespace, service) (
              rate(http_request_duration_seconds_count{namespace="demo", path!~"healthz|readyz"}[2m])
            ) < 0.2
          for: 1m
          labels:
            severity: warning
            lab: kursinis
          annotations:
            summary: "Service {{ $labels.namespace }}/{{ $labels.service }} receives almost no requests"
            description: "Service {{ $labels.namespace }}/{{ $labels.service }} has received fewer than 0.2 requests per second (probes excluded) for 1 minute; its normal load is about 1 request per second."
